# Desarrollo local. NO usar en producción: captcha apagado, Swagger abierto, cookies sin Secure.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:laaccion}
    username: ${POSTGRES_USER:laaccion}
    password: ${POSTGRES_PASSWORD:laaccion_dev}

server:
  servlet:
    session:
      cookie:
        secure: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  public-base-url: http://localhost:4300
  cors:
    allowed-origins: http://localhost:4300
  security:
    secure-cookies: false
    ip-hash-secret: dev-only-secret-dev-only-secret-dev-only
    # CSP relajada para que funcione Swagger UI en local.
    content-security-policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'"
  captcha:
    enabled: false
    turnstile-secret: ""
  storage:
    type: local

logging:
  level:
    com.laaccion: DEBUG
