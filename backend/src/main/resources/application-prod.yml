# Producción (Railway). Todo lo sensible llega por variables de entorno SIN valor por defecto:
# si falta alguna, la aplicación falla al arrancar en vez de funcionar a medias.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
