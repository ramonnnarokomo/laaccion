# Base de datos para desarrollo local. En producción la BD la pone Railway.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laaccion}
      POSTGRES_USER: ${POSTGRES_USER:-laaccion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laaccion_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - laaccion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  laaccion_pgdata:
